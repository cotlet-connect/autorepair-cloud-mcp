[project]
name = "autorepair-cloud-mcp"
version = "1.1.0"
description = "Connect AutoRepair Cloud to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No AutoRepair Cloud API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["autorepair cloud", "autorepair cloud api", "autorepair cloud mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/autorepair-cloud-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=autorepair-cloud"
Source = "https://github.com/cotlet-connect/autorepair-cloud-mcp"

[project.scripts]
autorepair-cloud-mcp = "autorepair_cloud_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"autorepair_cloud_agent.py" = "autorepair_cloud_agent.py"

[tool.hatch.build.targets.sdist]
include = ["autorepair_cloud_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
